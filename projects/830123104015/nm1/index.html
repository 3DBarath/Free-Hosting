<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartConnect</title>
  <style>
    :root {
      --primary-color: #007BFF;
      --secondary-color: #6c757d;
      --success-color: #28a745;
      --danger-color: #dc3545;
      --background-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: var(--background-gradient);
    }
    .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 2rem; }
    .login-card {
      background: rgba(255,255,255,0.95);
      padding: 2.5rem;
      border-radius: 1.5rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      width: 100%; max-width: 400px;
      transform: translateY(20px);
      opacity: 0;
      animation: slideUp 0.6s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
    }
    @keyframes slideUp { to { opacity:1; transform: translateY(0); } }
    .navbar {
      position: sticky; top: 0;
      background: rgba(255,255,255,0.98);
      backdrop-filter: blur(10px);
      box-shadow: 0 2px 15px rgba(0,0,0,0.1);
      padding: 0.8rem 2rem;
      z-index: 1000;
    }
    .nav-container { display:flex; justify-content: space-between; align-items:center; max-width:1200px; margin:0 auto; }
    .nav-links { display:flex; gap:1.5rem; }
    .nav-link {
      color:#333; text-decoration:none; padding:0.5rem 1rem;
      border-radius:0.5rem; transition: all 0.3s ease;
    }
    .nav-link:hover { background:rgba(0,123,255,0.1); color: var(--primary-color); }
    .nav-link.active { background: var(--primary-color); color: white; }
    .logout-btn { background: var(--danger-color); color:white; padding:0.5rem 1.5rem; border-radius:0.5rem; cursor:pointer; transition: background 0.3s ease; }
    .logout-btn:hover { background: #bb2d3b; }
    .main-content { padding:2rem; max-width:1200px; margin:0 auto; }
    .section {
      background:white; border-radius:1rem;
      padding:2rem; margin-bottom:2rem;
      box-shadow:0 4px 20px rgba(0,0,0,0.05);
      opacity:1; transform:translateY(0);
      transition: opacity 0.5s ease;
    }
    .hidden { display: none !important; }
    .form-group { margin-bottom:1.5rem; }
    .form-group label { display:block; margin-bottom:0.5rem; font-weight:500; }
    input, select, textarea {
      width:100%; padding:0.8rem;
      border:2px solid #e9ecef; border-radius:0.5rem;
      transition: border-color 0.3s ease;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--primary-color);
      outline:none;
      box-shadow:0 0 0 3px rgba(0,123,255,0.25);
    }
    .btn { padding:0.8rem 1.5rem; border:none; border-radius:0.5rem; font-weight:500; cursor:pointer; transition: transform 0.2s ease, background 0.3s ease; }
    .btn-primary { background: var(--primary-color); color:white; }
    .btn-primary:hover { background: #0056b3; transform: translateY(-2px); }
    .notification {
      position: fixed; top:1rem; right:1rem;
      padding:1rem 1.5rem; border-radius:0.5rem;
      color:white; display:flex; align-items:center; gap:0.8rem;
      opacity:0; transform:translateX(120%);
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
      z-index:9999;
    }
    .notification.show { opacity:1; transform:translateX(0); }
    .notification.success { background: var(--success-color); }
    .notification.error { background: var(--danger-color); }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.75rem; text-align: left; }
    th { background: #f8f9fa; }
    @media (max-width:768px) {
      .nav-container { flex-direction:column; gap:1rem; }
      .nav-links { flex-wrap:wrap; justify-content:center; }
      .main-content { padding:1rem; }
      .section { padding:1.5rem; }
    }
  </style>
</head>
<body>

<div class="login-container" id="loginContainer">
  <div class="login-card">
    <h1>SmartConnect</h1>
    <p>Bridging Education Communities</p>
    <div class="form-group">
      <label for="userType">Role</label>
      <select id="userType">
        <option value="Faculty">Faculty</option>
        <option value="Parent">Parent</option>
      </select>
    </div>
    <div class="form-group">
      <label for="userId">User ID</label>
      <input type="text" id="userId" placeholder="F101 or P202" required />
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" required />
    </div>
    <button class="btn btn-primary" onclick="login()">Sign In</button>
  </div>
</div>

<div id="app" class="hidden">
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <div class="nav-links" id="navLinks">
        <a href="#" class="nav-link active" data-section="attendance">Attendance</a>
        <a href="#" class="nav-link" data-section="grades">Grades</a>
        <a href="#" class="nav-link" data-section="examSchedule">Exam Schedule</a>
        <a href="#" class="nav-link" data-section="events">Events</a>
        <a href="#" class="nav-link" data-section="about">About</a>
      </div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </nav>
  <main class="main-content">
    <section class="section" id="attendance">
      <h2>Attendance</h2>
      <form id="attendanceForm">
        <div class="form-group"><label>Student ID</label><input type="text" id="attStudentId" required /></div>
        <div class="form-group"><label>Date</label><input type="date" id="attDate" required /></div>
        <div class="form-group">
          <label>Status</label>
          <select id="attStatus" required><option value="">-- Select Status --</option><option>Present</option><option>Absent</option></select>
        </div>
        <button class="btn btn-primary" type="submit">Submit Attendance</button>
      </form>
      <div id="attendanceView" class="hidden"></div>
    </section>

    <section class="section" id="grades">
      <h2>Grades</h2>
      <form id="gradesForm">
        <div class="form-group"><label>Student ID</label><input type="text" id="gradeStudentId" required /></div>
        <div class="form-group"><label>Subject</label><input type="text" id="gradeSubject" required /></div>
        <div class="form-group"><label>Grade</label><input type="text" id="gradeValue" required /></div>
        <button class="btn btn-primary" type="submit">Submit Grade</button>
      </form>
      <div id="gradesView" class="hidden"></div>
    </section>

    <section class="section" id="examSchedule">
      <h2>Exam Schedule</h2>
      <form id="examForm">
        <div class="form-group"><label>Subject</label><input type="text" id="examSubject" required /></div>
        <div class="form-group"><label>Date</label><input type="date" id="examDate" required /></div>
        <button class="btn btn-primary" type="submit">Add Schedule</button>
      </form>
      <div id="examView" class="hidden"></div>
    </section>

    <section class="section" id="events">
      <h2>Events</h2>
      <form id="eventForm">
        <div class="form-group"><label>Event Title</label><input type="text" id="eventTitle" required /></div>
        <div class="form-group"><label>Date</label><input type="date" id="eventDate" required /></div>
        <button class="btn btn-primary" type="submit">Add Event</button>
      </form>
      <div id="eventView" class="hidden"></div>
    </section>

    <section class="section" id="about">
      <h2>About</h2>
      <p><strong>SmartConnect</strong> is developed by a collaborative team:</p>
      <ul>
        <li>Dhinesh Kumar</li>
        <li>Beni</li>
        <li>Anbu</li>
        <li>Rifanshiya</li>
        <li>Yazhini</li>
        <li>Akalya</li>
      </ul>
    </section>
  </main>
</div>

<div id="notification" class="notification"></div>

<script>
  let currentRole = '';
  let attendanceList = [], gradeList = [], examList = [], eventList = [];

  const navLinks = document.querySelectorAll('.nav-link');

  function setupNavigation() {
    navLinks.forEach(link => {
      link.addEventListener('click', e => {
        e.preventDefault();
        switchSection(link.dataset.section);
        setActive(link);
      });
    });
  }

  function customizeForRole() {
    if (currentRole === 'Parent') {
      document.getElementById('attendanceForm').classList.add('hidden');
      document.getElementById('gradesForm').classList.add('hidden');
      document.getElementById('examForm').classList.add('hidden');
      document.getElementById('eventForm').classList.add('hidden');
      document.getElementById('attendanceView').classList.remove('hidden');
      document.getElementById('gradesView').classList.remove('hidden');
      document.getElementById('examView').classList.remove('hidden');
      document.getElementById('eventView').classList.remove('hidden');
      renderDataTables();
    }
  }

  function switchSection(id) {
    document.querySelectorAll('.section').forEach(sec => sec.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
  }

  function setActive(activeLink) {
    navLinks.forEach(l => l.classList.remove('active'));
    activeLink.classList.add('active');
  }

  function login() {
    currentRole = document.getElementById('userType').value;
    if (!document.getElementById('userId').value.trim()) {
      alert("Please enter User ID");
      return;
    }

    document.getElementById('loginContainer').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');

    setupNavigation();
    customizeForRole();
    switchSection(currentRole === 'Parent' ? 'grades' : 'attendance');

    if (currentRole === 'Faculty') {
      document.getElementById('attendanceForm').addEventListener('submit', e => {
        e.preventDefault();
        attendanceList.push({
          student: attStudentId.value,
          date: attDate.value,
          status: attStatus.value
        });
        showNotification("Attendance submitted!");
        e.target.reset();
      });

      document.getElementById('gradesForm').addEventListener('submit', e => {
        e.preventDefault();
        gradeList.push({
          student: gradeStudentId.value,
          subject: gradeSubject.value,
          grade: gradeValue.value
        });
        showNotification("Grade submitted!");
        e.target.reset();
      });

      document.getElementById('examForm').addEventListener('submit', e => {
        e.preventDefault();
        examList.push({ subject: examSubject.value, date: examDate.value });
        showNotification("Exam scheduled!");
        e.target.reset();
      });

      document.getElementById('eventForm').addEventListener('submit', e => {
        e.preventDefault();
        eventList.push({ title: eventTitle.value, date: eventDate.value });
        showNotification("Event added!");
        e.target.reset();
      });
    }
  }

  function logout() {
    document.getElementById('loginContainer').classList.remove('hidden');
    document.getElementById('app').classList.add('hidden');
    document.getElementById('userId').value = '';
    document.getElementById('password').value = '';
  }

  function showNotification(message, type = 'success', duration = 3000) {
    const n = document.getElementById('notification');
    n.className = `notification ${type} show`;
    n.textContent = message;
    setTimeout(() => n.classList.remove('show'), duration);
  }

  function renderDataTables() {
    document.getElementById('attendanceView').innerHTML = generateTable(attendanceList, ['student', 'date', 'status']);
    document.getElementById('gradesView').innerHTML = generateTable(gradeList, ['student', 'subject', 'grade']);
    document.getElementById('examView').innerHTML = generateTable(examList, ['subject', 'date']);
    document.getElementById('eventView').innerHTML = generateTable(eventList, ['title', 'date']);
  }

  function generateTable(data, columns) {
    if (data.length === 0) return "<p>No data available.</p>";
    const rows = data.map(item => `<tr>${columns.map(col => `<td>${item[col]}</td>`).join('')}</tr>`).join('');
    const headers = columns.map(col => `<th>${col.charAt(0).toUpperCase() + col.slice(1)}</th>`).join('');
    return `<table><thead><tr>${headers}</tr></thead><tbody>${rows}</tbody></table>`;
  }
</script>
</body>
</html>
