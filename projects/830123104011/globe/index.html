<!DOCTYPE html>
<html>
<head>
  <title>3D Neon World</title>
  <style>
    body { margin: 0; background: #000; }
    canvas { display: block; }
  </style>
</head>
<body>
  <!-- Include Three.js via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
    // Scene setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(
      75, window.innerWidth / window.innerHeight, 0.1, 1000
    );
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Neon-like material
    const neonMaterial = new THREE.MeshPhongMaterial({
      color: 0x00ffff,
      emissive: 0x00ffff, // Glow effect
      shininess: 100
    });

    // Create neon spheres
    const sphereGeometry = new THREE.SphereGeometry(0.5, 32, 32);
    const sphere1 = new THREE.Mesh(sphereGeometry, neonMaterial);
    const sphere2 = new THREE.Mesh(sphereGeometry, neonMaterial);
    sphere1.position.set(-2, 0, 0);
    sphere2.position.set(2, 0, 0);
    scene.add(sphere1);
    scene.add(sphere2);

    // Add lighting
    const ambientLight = new THREE.AmbientLight(0x404040);
    const pointLight = new THREE.PointLight(0xffffff, 1);
    pointLight.position.set(5, 5, 5);
    scene.add(ambientLight);
    scene.add(pointLight);

    camera.position.z = 5;

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      sphere1.rotation.x += 0.01;
      sphere1.rotation.y += 0.01;
      sphere2.rotation.x += 0.01;
      sphere2.rotation.y += 0.01;
      renderer.render(scene, camera);
    }
    animate();

    // Responsive resizing
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
