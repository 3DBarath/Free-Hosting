<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Network Globe</title>
  <style>
    :root {
      --navy: #0A192F;
      --teal: #64FFDA;
      --purple: #8A2BE2;
    }

    body, html {
      margin: 0;
      padding: 0;
      background: var(--navy);
      overflow: hidden;
    }

    #globe-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div id="globe-container"></div>

  <script defer src="https://unpkg.com/three@0.132.2/build/three.min.js"></script>
  <script defer src="https://unpkg.com/three@0.132.2/examples/js/controls/OrbitControls.js"></script>

  <script defer>
    window.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('globe-container');

      const teal = getComputedStyle(document.documentElement).getPropertyValue('--teal').trim();
      const purple = getComputedStyle(document.documentElement).getPropertyValue('--purple').trim();

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(renderer.domElement);

      // Lighting
      scene.add(new THREE.AmbientLight(0x444444));

      // Sphere points (vertices)
      const radius = 5;
      const geometry = new THREE.SphereGeometry(radius, 30, 30);
      const positionAttr = geometry.getAttribute('position');
      const points = [];
      for (let i = 0; i < positionAttr.count; i++) {
        const vertex = new THREE.Vector3();
        vertex.fromBufferAttribute(positionAttr, i);
        points.push(vertex.clone());
      }

      // Nodes
      const nodeGeometry = new THREE.SphereGeometry(0.05, 8, 8);
      const nodeMaterial = new THREE.MeshBasicMaterial({ color: new THREE.Color(teal) });
      const nodes = new THREE.Group();

      points.forEach(point => {
        const node = new THREE.Mesh(nodeGeometry, nodeMaterial);
        node.position.copy(point);
        nodes.add(node);
      });
      scene.add(nodes);

      // Connections
      const lines = new THREE.Group();
      const lineMaterial = new THREE.LineBasicMaterial({ 
        color: new THREE.Color(teal),
        transparent: true,
        opacity: 0.3
      });

      points.forEach((pointA, index) => {
        for (let j = index + 1; j < points.length; j++) {
          const pointB = points[j];
          if (Math.random() < 0.0002) {
            const lineGeometry = new THREE.BufferGeometry().setFromPoints([pointA, pointB]);
            const line = new THREE.Line(lineGeometry, lineMaterial);
            lines.add(line);
          }
        }
      });
      scene.add(lines);

      // Particles
      const particleGeometry = new THREE.BufferGeometry();
      const particleCount = 1000;
      const posArray = new Float32Array(particleCount * 3);

      for (let i = 0; i < particleCount * 3; i++) {
        posArray[i] = (Math.random() - 0.5) * 10;
      }

      particleGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
      const particleMaterial = new THREE.PointsMaterial({
        size: 0.01,
        color: new THREE.Color(purple),
        transparent: true,
        blending: THREE.AdditiveBlending
      });
      const particles = new THREE.Points(particleGeometry, particleMaterial);
      scene.add(particles);

      // Camera & Controls
      camera.position.z = 15;
      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableZoom = true;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.5;
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      // Animate
      function animate() {
        requestAnimationFrame(animate);
        nodes.rotation.y += 0.0005;
        lines.rotation.y += 0.0005;

        const pos = particles.geometry.attributes.position.array;
        for (let i = 0; i < pos.length; i += 3) {
          pos[i + 1] += 0.01;
          if (pos[i + 1] > 5) pos[i + 1] = -5;
        }
        particles.geometry.attributes.position.needsUpdate = true;

        controls.update();
        renderer.render(scene, camera);
      }

      // Resize
      window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
      });

      animate();
    });
  </script>
</body>
</html>
