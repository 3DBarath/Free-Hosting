<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Hello World</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        .cyber-container {
            position: relative;
            z-index: 1;
        }

        .cyber-text {
            position: relative;
            font-size: 8vw;
            color: transparent;
            background: linear-gradient(45deg, #00f3ff, #0066ff);
            -webkit-background-clip: text;
            background-clip: text;
            text-shadow: 0 0 20px rgba(0, 102, 255, 0.5);
            animation: glow 2s ease-in-out infinite alternate;
        }

        .cyber-text::before {
            content: 'HELLO WORLD';
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
            color: transparent;
            background: linear-gradient(45deg, #ff00ff, #ff0066);
            -webkit-background-clip: text;
            background-clip: text;
            filter: blur(20px);
        }

        .grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(rgba(0, 102, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 102, 255, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes glow {
            from {
                filter: hue-rotate(0deg);
                transform: scale(1);
            }
            to {
                filter: hue-rotate(360deg);
                transform: scale(1.05);
            }
        }

        @keyframes gridMove {
            from { background-position: 0 0; }
            to { background-position: 20px 20px; }
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(to bottom, 
                transparent 0%,
                rgba(0, 255, 255, 0.5) 50%,
                transparent 100%);
            animation: scan 4s linear infinite;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        @keyframes scan {
            0% { top: -100%; }
            100% { top: 100%; }
        }
    </style>
</head>
<body>
    <canvas class="particles"></canvas>
    <div class="grid"></div>
    <div class="scanline"></div>
    <div class="cyber-container">
        <h1 class="cyber-text">HELLO WORLD</h1>
    </div>

    <script>
        // Particle animation
        const canvas = document.querySelector('.particles');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.radius = Math.random() * 2;
                this.color = `hsl(${Math.random() * 360}, 100%, 50%)`;
                this.life = 1;
                this.decay = 0.001 + Math.random() * 0.02;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
                
                if (this.life <= 0) this.reset();
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.life;
                ctx.fill();
            }
        }

        const particles = Array.from({ length: 100 }, () => new Particle());

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
            
            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Mouse interaction
        document.addEventListener('mousemove', (e) => {
            const container = document.querySelector('.cyber-container');
            const x = (e.clientX / width - 0.5) * 20;
            const y = (e.clientY / height - 0.5) * 10;
            container.style.transform = `perspective(1000px) rotateX(${y}deg) rotateY(${x}deg)`;
        });
    </script>
</body>
</html>
