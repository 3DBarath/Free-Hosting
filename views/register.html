<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZipHost - New Account</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --navy: #0A192F;
            --teal: #64FFDA;
            --slate: #8892B0;
            --light-slate: #CCD6F6;
            --gradient: linear-gradient(45deg, var(--teal), #00C9A7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--navy);
            overflow: hidden;
            position: relative;
        }
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(100, 255, 218, 0.3);
            border-top-color: var(--teal);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* Add to existing CSS */
        .home-link {
            position: fixed;
            top: 1.5rem;
            left: 1.5rem;
            color: var(--teal);
            text-decoration: none;
            font-weight: 600;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }

        .home-link:hover {
            color: var(--light-slate);
            transform: translateX(-3px);
        }

        .home-link i {
            font-size: 1.2rem;
        }
        .dob-group{
            position: relative;
        }

        .error-message {
            color: #ff6b6b;
            font-size: 0.8rem;
            margin-top: 0.5rem;
            display: none;
        }

        .auth-blob {
            position: absolute;
            width: 600px;
            height: 600px;
            background: rgba(100, 255, 218, 0.03);
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            filter: blur(80px);
            z-index: 0;
        }

        .auth-blob:nth-child(1) { top: -200px; left: -200px; }
        .auth-blob:nth-child(2) { bottom: -200px; right: -200px; }

        .container {
            background: rgba(10, 25, 47, 0.9);
            backdrop-filter: blur(15px);
            padding: 2.5rem;
            border-radius: 12px;
            border: 1px solid rgba(100, 255, 218, 0.2);
            width: 400px;
            transform: translateY(20px);
            opacity: 0;
            animation: slideUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            position: relative;
            z-index: 1;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            color: var(--teal);
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2em;
            letter-spacing: -0.5px;
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--slate);
            font-weight: 500;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.5rem;
            background: rgba(100, 255, 218, 0.05);
            border: 1px solid rgba(100, 255, 218, 0.2);
            border-radius: 6px;
            color: var(--light-slate);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--teal);
            box-shadow: 0 0 15px rgba(100, 255, 218, 0.2);
            outline: none;
            background: rgba(100, 255, 218, 0.08);
        }

        button {
            width: 100%;
            padding: 0.8rem;
            background: var(--gradient);
            color: var(--navy);
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 1rem;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(100, 255, 218, 0.3);
        }

        .link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .link a {
            color: var(--teal);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
            font-size: 0.9rem;
        }

        .link a:hover {
            color: var(--light-slate);
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 2.3rem;
            color: var(--slate);
            font-size: 1.1rem;
        }

        @media (max-width: 480px) {
            .container {
                width: 90%;
                padding: 1.5rem;
            }
        }
    </style>
</head>
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Keep previous head content -->
    <style>
        /* Add to existing CSS */
        .dob-group {
            position: relative;
        }
        
        .error-message {
            color: #ff6b6b;
            font-size: 0.8rem;
            margin-top: 0.5rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="auth-blob"></div>
    <div class="auth-blob"></div>
    
    <a href="/" class="home-link">
        <i class="fas fa-home"></i>
        Zip Host
    </a>

    <div class="container">
        <h2>Developer Registration</h2>
        <form id="register-form">
            <div class="form-group">
                <label for="regno">Developer ID</label>
                <i class="fas fa-user-tag input-icon"></i>
                <input type="text" id="regno" name="regno" required 
                       pattern="8301\d{8}" 
                       title="Registration number must start with 8301 and have 12 digits">
                <div class="error-message" id="regno-error">Invalid registration number format</div>
            </div>
            
            <div class="form-group dob-group">
                <label for="dob">Date of Birth</label>
                <i class="fas fa-calendar input-icon"></i>
                <input type="date" id="dob" name="dob" required 
                       pattern="\d{4}-\d{2}-\d{2}"
                       title="Enter your date of birth in yyyy-mm-dd format">
                <div class="error-message" id="dob-error">Invalid date of birth</div>
            </div>
            
            <div class="form-group">
                <label for="password">Access Code</label>
                <i class="fas fa-key input-icon"></i>
                <input type="password" id="password" name="password" required 
                       minlength="8"
                       title="Password must be at least 8 characters">
            </div>
            
            <button type="submit">Create Account</button>
            <div class="link">
                <p>Existing user? <a href="/login">Sign in here</a></p>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('regno').addEventListener('input', function() {
            const isValid = VALID_REGNO.test(this.value);
            this.style.borderColor = isValid ? 'var(--teal)' : '#ff6b6b';
            document.getElementById('regno-error').style.display = isValid ? 'none' : 'block';
        });

        document.getElementById('dob').addEventListener('change', function() {
            const isValid = isValidDate(this.value) && validateCredentials(
                document.getElementById('regno').value,
                this.value
            );
            this.style.borderColor = isValid ? 'var(--teal)' : '#ff6b6b';
            document.getElementById('dob-error').style.display = isValid ? 'none' : 'block';
        });

        document.getElementById('register-form').addEventListener('submit', async function(event) {
                event.preventDefault();
                const form = event.target;
                const btn = form.querySelector('button');
                
                // Reset UI
                btn.innerHTML = '<div class="spinner"></div>';
                btn.disabled = true;

                try {
                    const formData = new FormData(form);
                    const response = await fetch('/register', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        body: new URLSearchParams(formData)
                    });

                    const result = await response.json();
                    
                    if (response.ok) {
                        alert('Registration successful! Redirecting to login...');
                        window.location.href = '/login';
                    } else {
                        alert(result.error || 'Registration failed');
                    }
                } catch (error) {
                    alert('Network error - please try again');
                } finally {
                    btn.innerHTML = 'Create Account';
                    btn.disabled = false;
                }
            });

        function showError(message, field = null) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = message;
            
            if (field) {
                document.getElementById(`${field}-error`).replaceWith(errorDiv);
            } else {
                document.querySelector('.link').before(errorDiv);
            }
            }

        function showSuccess(message) {
            const alert = document.createElement('div');
            alert.style.position = 'fixed';
            alert.style.top = '20px';
            alert.style.right = '20px';
            alert.style.padding = '1rem 2rem';
            alert.style.background = 'rgba(100, 255, 218, 0.9)';
            alert.style.color = 'var(--navy)';
            alert.style.borderRadius = '6px';
            alert.style.boxShadow = '0 5px 15px rgba(0,0,0,0.2)';
            alert.textContent = message;
            document.body.appendChild(alert);
        }
    </script>
</body>
</html>
</html>
