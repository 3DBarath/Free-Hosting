<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ZIP Host</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: 'Segoe UI', sans-serif;
      background: #f0f8ff;
      min-height: 100vh;
    }
    .loader {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255,255,255,0.8);
      display: none;
      place-items: center;
      z-index: 9999;
    }
    .spinner {
      width: 50px; height: 50px;
      border: 4px solid #ccc;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .upload-box {
      border: 2px dashed #3498db;
      background: white;
      padding: 2rem;
      text-align: center;
      margin: 2rem auto;
      max-width: 600px;
      border-radius: 10px;
      position: relative;
    }
    #zipInput {
      display: none;
    }
    .upload-label {
      cursor: pointer;
      display: block;
      color: #3498db;
      font-size: 1.2rem;
      margin-bottom: 1rem;
    }
    .file-name {
      color: #666;
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }
    .toggle-group {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin: 2rem 0;
    }
    .toggle-btn {
      padding: 0.8rem 2rem;
      border: none;
      background: #e0e0e0;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }
    .toggle-btn.active {
      background: #3498db;
      color: white;
      box-shadow: 0 3px 6px rgba(52,152,219,0.3);
    }
    .result-card {
      background: white;
      padding: 1.5rem;
      margin: 1rem auto;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      max-width: 600px;
      text-align: center;
    }
    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .animate-pop { animation: popIn 0.5s ease forwards; }
    @media (max-width: 768px) {
      .upload-box, .result-card { margin: 1rem; }
      .toggle-group { flex-direction: column; }
    }
  </style>
</head>
<body>

<div class="loader"><div class="spinner"></div></div>

<main class="container">
  <h1 class="title animate-pop" style="text-align:center;">Project Host</h1>

  <form id="uploadForm" class="upload-box animate-pop">
    <input type="file" name="zipfile" id="zipInput" accept=".zip">
    <label for="zipInput" class="upload-label">📁 Click to Browse or Drop ZIP File</label>
    <div class="file-name" id="fileName">(No file selected)</div>
    <button type="submit" class="animate-pop" style="margin-top: 1rem; padding: 0.8rem 2rem; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer;">
      Upload
    </button>
  </form>

  <div class="toggle-group animate-pop">
    <button class="toggle-btn active" data-view="preview">Preview</button>
    <button class="toggle-btn" data-view="files">Files</button>
  </div>

  <div id="resultContainer" class="animate-pop"></div>
</main>

<script>
// Elements
const uploadForm = document.getElementById('uploadForm');
const zipInput = document.getElementById('zipInput');
const fileNameDisplay = document.getElementById('fileName');
const loader = document.querySelector('.loader');
const resultContainer = document.getElementById('resultContainer');

// File input change
zipInput.addEventListener('change', () => {
  fileNameDisplay.textContent = zipInput.files.length ? zipInput.files[0].name : '(No file selected)';
});

// Drag and Drop support
uploadForm.addEventListener('dragover', (e) => {
  e.preventDefault();
  uploadForm.style.borderColor = '#2ecc71';
});
uploadForm.addEventListener('dragleave', () => {
  uploadForm.style.borderColor = '#3498db';
});
uploadForm.addEventListener('drop', (e) => {
  e.preventDefault();
  uploadForm.style.borderColor = '#3498db';
  const files = e.dataTransfer.files;
  if (files.length) {
    zipInput.files = files;
    fileNameDisplay.textContent = files[0].name;
  }
});

// Upload Form Submission
// Upload Form Submission
uploadForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!zipInput.files.length) return alert('Select a ZIP file first.');

  loader.style.display = 'grid';
  const formData = new FormData();
  formData.append('zipfile', zipInput.files[0]);

  try {
    const res = await fetch('/upload', { method: 'POST', body: formData });
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    // Dynamically insert the successful upload links into the result container
    resultContainer.innerHTML = 
      `<div class="result-card">
        <h2>Upload Successful</h2>
        <p><a href="${data.viewUrl}" target="_blank">🔗 Live Preview</a></p>
        <p><a href="${data.url}" target="_blank">📁 Access Files</a></p>  <!-- Adjusted the label text for clarity -->
      </div>`;
  } catch (err) {
    alert('Error: ' + err.message);
  } finally {
    loader.style.display = 'none';
  }
});


// Toggle Buttons
document.querySelectorAll('.toggle-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const view = btn.dataset.view;
    // For demo, just change background color based on view
    if (view === 'preview') {
      resultContainer.style.background = '#ffffff';
    } else if (view === 'files') {
      resultContainer.style.background = '#f9f9f9';
    }
  });
});
</script>

</body>
</html>
