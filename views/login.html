<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZipHost - Secure Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/login.css') }}?v=1.0">
</head>
<body>
    <div class="auth-blob"></div>
    <div class="auth-blob"></div>
    
    <div class="container">
        <h2>Secure Access Portal</h2>
        <form id="login-form">
            <div class="form-group">
                <label for="regno">Register Number</label>
                <i class="fas fa-user input-icon"></i>
                <input type="text" id="regno" name="regno" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="password" name="password" required>
                <span class="toggle-password"><i class="fas fa-eye"></i></span>
            </div>
            
            <button type="submit">Authenticate</button>
            <div class="link">
                <p>New user? <a href="/register">Create account</a></p>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const regno = document.getElementById('regno').value;
            const password = document.getElementById('password').value;

            fetch('/login', {
                method: 'POST',
                body: new URLSearchParams({
                    'regno': regno,
                    'password': password
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Modern alert style
                    const alert = document.createElement('div');
                    alert.style.position = 'fixed';
                    alert.style.top = '20px';
                    alert.style.right = '20px';
                    alert.style.padding = '1rem 2rem';
                    alert.style.background = 'rgba(100, 255, 218, 0.9)';
                    alert.style.color = 'var(--navy)';
                    alert.style.borderRadius = '6px';
                    alert.style.boxShadow = '0 5px 15px rgba(0,0,0,0.2)';
                    alert.textContent = '✓ Authentication successful';
                    document.body.appendChild(alert);
                    
                    setTimeout(() => {
                        window.location.href = '/home';
                    }, 1500);
                } else {
                    alert('Authentication failed: ' + data.error);
                }
            });
        });
        const togglePassword = document.querySelector('.toggle-password i');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            togglePassword.className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
        });
    </script>
</body>
<!-- Add below <body> tag -->
    <a href="/" class="home-link">
        <i class="fas fa-home"></i>
        Zip Host
    </a>
</html>
