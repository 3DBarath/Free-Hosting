<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZipHost - Secure Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
    --navy: #0A192F;
    --teal: #64FFDA;
    --slate: #8892B0;
    --light-slate: #CCD6F6;
    --gradient: linear-gradient(45deg, var(--teal), #00C9A7);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', system-ui, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: var(--navy);
    overflow: hidden;
    position: relative;
}
.toggle-password {
    position: absolute;
    top: 2.3rem;
    right: 1rem;
    color: var(--slate);
    cursor: pointer;
    font-size: 1.1rem;
    z-index: 10;
}

.toggle-password:hover {
    color: var(--teal);
}

.home-link {
        position: fixed;
        top: 1.5rem;
        left: 1.5rem;
        z-index: 1000;
        text-decoration: none;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    .home-link-content {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.8rem 1.2rem;
        background: rgba(100, 255, 218, 0.1);
        border-radius: 50px;
        border: 1px solid rgba(100, 255, 218, 0.3);
        backdrop-filter: blur(5px);
        transition: all 0.3s ease;
    }
    
    .home-link:hover .home-link-content {
        background: rgba(201, 110, 6, 0.616);
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(100, 255, 218, 0.2);
    }
    
    .home-link i {
        color: var(--teal);
        font-size: 1.2rem;
        transition: transform 0.3s ease;
        transform: rotate(45deg);
    }
    
    .home-link:hover i {
        transform: rotate(0deg);
    }
    
    .home-link-text {
        color: var(--teal);
        /* color: black; */
        font-weight: 600;
        letter-spacing: 0.5px;
        background: linear-gradient(45deg, var(--teal), #00C9A7);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        transition: background-position 0.3s ease;
    }
    
    @media (max-width: 768px) {
            .home-link {
                position: fixed; /* Keep it fixed */
                top: 1rem; /* Adjust position for mobile */
                left: 1rem;
                /* transform: scale(0.8); Make it slightly smaller */
                margin: 0; /* Remove margin */
                z-index: 1000; /* Ensure it stays on top */
            }
        
            .home-link-content {
                padding: 0.6rem 1rem; /* Reduce padding */
            }
        
            .home-link-text {
                font-size: 0.9rem; /* Smaller text */
            }
        
        }

/* Cyber-style background elements */
.auth-blob {
    position: absolute;
    width: 600px;
    height: 600px;
    background: rgba(100, 255, 218, 0.03);
    border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
    filter: blur(80px);
    z-index: 0;
}

.auth-blob:nth-child(1) {
    top: -200px;
    left: -200px;
}

.auth-blob:nth-child(2) {
    bottom: -200px;
    right: -200px;
}

.container {
    background: rgba(10, 25, 47, 0.9);
    backdrop-filter: blur(15px);
    padding: 2.5rem;
    border-radius: 12px;
    border: 1px solid rgba(100, 255, 218, 0.2);
    width: 400px;
    transform: translateY(20px);
    opacity: 0;
    animation: slideUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    position: relative;
    z-index: 1;
    box-shadow: 0 15px 35px rgba(0,0,0,0.2);
}

@keyframes slideUp {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

h2 {
    color: var(--teal);
    text-align: center;
    margin-bottom: 2rem;
    font-size: 2em;
    letter-spacing: -0.5px;
}

.form-group {
    margin-bottom: 1.5rem;
    position: relative;
}

label {
    display: block;
    margin-bottom: 0.5rem;
    color: var(--slate);
    font-weight: 500;
    font-size: 0.9rem;
}

input {
    width: 100%;
    padding: 0.8rem 1rem 0.8rem 2.5rem;
    background: rgba(100, 255, 218, 0.05);
    border: 1px solid rgba(100, 255, 218, 0.2);
    border-radius: 6px;
    color: var(--light-slate);
    font-size: 1rem;
    transition: all 0.3s ease;
}

input:focus {
    border-color: var(--teal);
    box-shadow: 0 0 15px rgba(100, 255, 218, 0.2);
    outline: none;
    background: rgba(100, 255, 218, 0.08);
}

button {
    width: 100%;
    padding: 0.8rem;
    background: var(--gradient);
    color: var(--navy);
    border: none;
    border-radius: 6px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 1rem;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(100, 255, 218, 0.3);
}

.link {
    text-align: center;
    margin-top: 1.5rem;
}

.link a {
    color: var(--teal);
    text-decoration: none;
    font-weight: 500;
    transition: color 0.3s ease;
    font-size: 0.9rem;
}

.link a:hover {
    color: var(--light-slate);
}

.input-icon {
    position: absolute;
    left: 1rem;
    top: 2.3rem;
    color: var(--slate);
    font-size: 1.1rem;
}

@media (max-width: 480px) {
    .container {
        width: 90%;
        padding: 1.5rem;
    }
    
    body {
        padding: 1rem;
    }
}
    </style>
</head>
<body>
    <div class="auth-blob"></div>
    <div class="auth-blob"></div>
    
    <div class="container">
        <h2>Secure Access Portal</h2>
        <form id="login-form">
            <div class="form-group">
                <label for="regno">Register Number</label>
                <i class="fas fa-user input-icon"></i>
                <input type="text" id="regno" name="regno" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="password" name="password" required>
                <span class="toggle-password"><i class="fas fa-eye"></i></span>
            </div>
            
            <button type="submit">Authenticate</button>
            <div class="link">
                <p>New user? <a href="/register">Create account</a></p>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(event) {
    event.preventDefault();
    const regno = document.getElementById('regno').value;
    const password = document.getElementById('password').value;

    fetch('/login', {
        method: 'POST',
        body: new URLSearchParams({
            'regno': regno,
            'password': password
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            // Modern alert style
            const alert = document.createElement('div');
            alert.style.position = 'fixed';
            alert.style.top = '20px';
            alert.style.right = '20px';
            alert.style.padding = '1rem 2rem';
            alert.style.background = 'rgba(100, 255, 218, 0.9)';
            alert.style.color = 'var(--navy)';
            alert.style.borderRadius = '6px';
            alert.style.boxShadow = '0 5px 15px rgba(0,0,0,0.2)';
            alert.textContent = '✓ Authentication successful';
            document.body.appendChild(alert);
            
            setTimeout(() => {
                window.location.href = '/home';
            }, 1500);
        } else {
            alert('Authentication failed: ' + data.error);
        }
    });
});
const togglePassword = document.querySelector('.toggle-password i');
const passwordInput = document.getElementById('password');

togglePassword.addEventListener('click', () => {
    const isPassword = passwordInput.type === 'password';
    passwordInput.type = isPassword ? 'text' : 'password';
    togglePassword.className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
});
    </script>
</body>
<a href="/" class="home-link">
    <div class="home-link-content">
        <i class="fas fa-home"></i> <!-- Changed from fa-home to rocket for more visual interest -->
        <span class="home-link-text">ZipHost</span>
    </div>
</a>
</html>
