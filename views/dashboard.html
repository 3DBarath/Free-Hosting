<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            padding: 2rem;
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 2rem auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            transform: translateY(20px);
            opacity: 0;
            animation: slideUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            color: #2d3436;
            margin-bottom: 2rem;
            font-size: 2.5em;
            text-align: center;
        }

        #uploads-list {
            list-style: none;
            margin: 2rem 0;
        }

        .upload-item {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .upload-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .upload-info {
            flex: 1;
        }

        .upload-info strong {
            color: #2d3436;
            font-size: 1.1em;
            display: block;
            margin-bottom: 0.5rem;
        }

        .upload-info a {
            color: #4ecdc4;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .upload-info a:hover {
            color: #ff6b6b;
        }

        .upload-time {
            color: #636e72;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .actions {
            margin-top: 2rem;
            text-align: center;
        }

        .actions a {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            background: #4ecdc4;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
            margin: 0 0.5rem;
        }

        .actions a:hover {
            background: #45b7b0;
            transform: translateY(-2px);
        }

        .logout-btn {
            background: #ff6b6b !important;
        }

        .logout-btn:hover {
            background: #e55a5a !important;
        }

        .empty-state {
            text-align: center;
            color: #636e72;
            padding: 2rem;
            font-size: 1.2em;
        }

        @media (max-width: 768px) {
            .dashboard-container {
                margin: 1rem;
                padding: 1.5rem;
            }

            .upload-item {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }

            .upload-time {
                justify-content: flex-end;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <h2>Welcome to Your Dashboard</h2>
        
        <ul id="uploads-list">
            <!-- Uploaded files will be displayed here -->
        </ul>

        <div class="actions">
            <a href="/">📁 Upload New Project</a>
            <a href="/logout" class="logout-btn">🚪 Logout</a>
        </div>
    </div>

    <script>
        fetch('/api/dashboard')
            .then(response => {
                if (!response.ok) throw new Error('Failed to load uploads');
                return response.json();
            })
            .then(data => {
                const list = document.getElementById('uploads-list');
                if (data.uploads && data.uploads.length > 0) {
                    data.uploads.forEach((upload, index) => {
                        const li = document.createElement('li');
                        li.className = 'upload-item';
                        li.style.animationDelay = `${index * 0.1}s`;
                        li.innerHTML = `
                            <div class="upload-info">
                                <strong>📄 ${upload.filename}</strong>
                                <a href="/projects/${upload.project_folder}" target="_blank">
                                    👀 View Project
                                </a>
                            </div>
                            <div class="upload-time">
                                <i class="far fa-clock"></i>
                                ${new Date(upload.upload_time).toLocaleString()}
                            </div>
                        `;
                        list.appendChild(li);
                    });
                } else {
                    list.innerHTML = '<div class="empty-state">No projects found. Start by uploading your first project!</div>';
                }
            })
            .catch(err => {
                alert(err.message);
            });
    </script>
</body>
</html>
