<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZipHost - Developer Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --navy: #0A192F;
            --teal: #64FFDA;
            --slate: #8892B0;
            --light-slate: #CCD6F6;
            --gradient: linear-gradient(45deg, var(--teal), #00C9A7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        /* Add to existing CSS */
        .home-link {
            position: fixed;
            top: 1.5rem;
            left: 1.5rem;
            color: var(--teal);
            text-decoration: none;
            font-weight: 600;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }

        .home-link:hover {
            color: var(--light-slate);
            transform: translateX(-3px);
        }

        .home-link i {
            font-size: 1.2rem;
        }

        body {
            min-height: 100vh;
            background: var(--navy);
            padding: 2rem;
            color: var(--light-slate);
        }

        /* Cyber-style background elements */
        .dashboard-blob {
            position: fixed;
            width: 800px;
            height: 800px;
            background: rgba(100, 255, 218, 0.03);
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            filter: blur(100px);
            z-index: -1;
        }

        .dashboard-blob:nth-child(1) { top: -300px; left: -300px; }
        .dashboard-blob:nth-child(2) { bottom: -300px; right: -300px; }

        .dashboard-container {
            max-width: 1200px;
            margin: 2rem auto;
            background: rgba(10, 25, 47, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 15px;
            padding: 2rem;
            border: 1px solid rgba(100, 255, 218, 0.2);
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            transform: translateY(20px);
            opacity: 0;
            animation: slideUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            color: var(--teal);
            margin-bottom: 2rem;
            font-size: 2.5em;
            text-align: center;
            letter-spacing: -0.5px;
        }

        #uploads-list {
            list-style: none;
            margin: 2rem 0;
        }

        .upload-item {
            background: rgba(100, 255, 218, 0.05);
            border-radius: 10px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(100, 255, 218, 0.2);
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .upload-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(100, 255, 218, 0.1);
            background: rgba(100, 255, 218, 0.08);
        }

        .upload-info {
            flex: 1;
            margin-right: 1.5rem;
        }

        .upload-info strong {
            color: var(--teal);
            font-size: 1.2em;
            display: block;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .upload-actions {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .upload-time {
            color: var(--slate);
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Modern Action Buttons */
        .actions {
            margin-top: 2rem;
            text-align: center;
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        .actions a {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.8rem 1.5rem;
            background: var(--gradient);
            color: var(--navy);
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .actions a:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(100, 255, 218, 0.3);
        }

        .logout-btn {
            background: linear-gradient(45deg, #ff6b6b, #ff4757) !important;
            color: white !important;
        }

        /* Modern Control Buttons */
        .view-btn, .share-btn, .delete-btn {
            padding: 0.5rem 1rem !important;
            border-radius: 6px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .view-btn {
            background: var(--gradient);
            color: var(--navy);
        }

        .share-btn {
            background: rgba(100, 255, 218, 0.1);
            color: var(--teal);
            border: 1px solid rgba(100, 255, 218, 0.3);
        }

        .delete-btn {
            background: rgba(255, 107, 107, 0.1);
            color: #ff6b6b;
            border: 1px solid rgba(255, 107, 107, 0.3);
        }

        .view-btn:hover, .share-btn:hover, .delete-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        @media (max-width: 768px) {
            .dashboard-container {
                margin: 1rem;
                padding: 1.5rem;
            }

            .upload-item {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }

            .upload-actions {
                width: 100%;
                justify-content: space-between;
            }

            .upload-time {
                justify-content: flex-start;
                width: 100%;
            }
        }
        /* Add to dashboard styles */
        .admin-badge {
            font-size: 0.6em;
            vertical-align: middle;
            background: rgba(255, 215, 0, 0.15);
            color: #ffd700;
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            margin-left: 1rem;
        }

        .admin-log {
            border-left: 3px solid #ffd700;
            background: rgba(10, 25, 47, 0.8) !important;
        }

        .user-regno {
            font-family: monospace;
            color: var(--teal);
            margin-right: 1rem;
            font-size: 0.9em;
        }

        .activity-item {
            padding: 1rem;
            margin-bottom: 0.8rem;
            background: rgba(100, 255, 218, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(100, 255, 218, 0.1);
        }

        .activity-time {
            color: var(--slate);
            font-size: 0.85em;
            margin-bottom: 0.3rem;
        }

        .activity-action {
            color: var(--light-slate);
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .activity-section {
        margin-top: 2rem;
        background: rgba(10, 25, 47, 0.8);
        border-radius: 10px;
        padding: 1rem;
        border: 1px solid rgba(100, 255, 218, 0.2);
    }

    .toggle-header {
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.5rem 1rem;
        border-radius: 8px;
        transition: all 0.3s ease;
    }

    .toggle-header:hover {
        background: rgba(100, 255, 218, 0.05);
    }

    .toggle-arrow {
        transition: transform 0.3s ease;
        margin-left: 1rem;
    }

    .activity-list {
        overflow: hidden;
        transition: all 0.3s ease-in-out;
        max-height: 1000px;
    }

    .activity-list.collapsed {
        max-height: 0;
        opacity: 0;
        margin: 0;
        padding: 0;
    }
    </style>
</head>
<body>
    <div class="dashboard-blob"></div>
    <div class="dashboard-blob"></div>
    
    <div class="dashboard-container">
        <h2>Developer Dashboard</h2>
        
        <ul id="uploads-list">
            <!-- Uploaded files will be displayed here -->
        </ul>
        <!-- Add after the uploads list -->
        <div class="activity-section">
            <div class="toggle-header" onclick="toggleActivityLogs()">
                <h3>
                    Activity Logs 
                    <span id="adminBadge" class="admin-badge" style="display: none;">🔒 Admin View</span>
                </h3>
                <span class="toggle-arrow" id="toggleArrow">▼</span>
            </div>
            <div class="activity-list" id="activity-list"></div>
        </div>

        <div class="actions">
            <a href="/deploy">
                <i class="fas fa-cloud-upload-alt"></i>
                New Project
            </a>
            <a href="/logout" class="logout-btn">
                <i class="fas fa-sign-out-alt"></i>
                Logout
            </a>
        </div>
    </div>

    <script>
        let logsVisible = true;

        function toggleActivityLogs() {
            const activityList = document.getElementById('activity-list');
            const arrow = document.getElementById('toggleArrow');
            
            logsVisible = !logsVisible;
            activityList.classList.toggle('collapsed');
            arrow.style.transform = logsVisible ? 'rotate(0deg)' : 'rotate(180deg)';
        }
        // Updated JavaScript with modern UI feedback
        async function deleteProject(projectId, projectFolder, listItem) {
            if (!projectId || !projectFolder) {
                alert('Invalid project data');
                return;
            }
            if (!confirm('Are you sure you want to delete this project?')) return;
            
            try {
                const response = await fetch(`/api/delete-project/${projectId}`, {
                    method: 'DELETE',
                });

                const data = await response.json();
                if (!response.ok || data.error) {
                    throw new Error(data.error || 'Failed to delete project');
                }
                
                listItem.style.opacity = '0';
                setTimeout(() => listItem.remove(), 300);
                showNotification('Project deleted successfully', 'var(--teal)');
                // Optional: Remove folder from server
                await fetch(`/api/cleanup/${projectFolder}`, { method: 'POST' });
                
            } catch (err) {
                showNotification(err.message, '#ff6b6b');
            }
        }

        function showNotification(message, color) {
            const notification = document.createElement('div');
            notification.style.position = 'fixed';
            notification.style.bottom = '20px';
            notification.style.right = '20px';
            notification.style.padding = '1rem 2rem';
            notification.style.background = color;
            notification.style.color = 'var(--navy)';
            notification.style.borderRadius = '6px';
            notification.style.boxShadow = '0 5px 15px rgba(0,0,0,0.2)';
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => notification.remove(), 3000);
        }
        async function fetchRegno() {
        const response = await fetch('/get_regno');
        const data = await response.json();
        return data.regno;
    }
    // Update the delete handler in your dashboard script
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('delete-btn')) {
                const listItem = e.target.closest('.upload-item');
                const projectId = e.target.dataset.id;
                const projectFolder = e.target.dataset.folder;
                
                if (!projectId || !projectFolder) {
                    alert('Invalid project data');
                    return;
                }
                
                deleteProject(projectId, projectFolder, listItem);
            }
        });
        // Add this at the top with other variables
        let baseUrl = '';

        // Add this before the fetchRegno() call
        async function fetchBaseUrl() {
            const response = await fetch('/get_base_url');
            const data = await response.json();
            baseUrl = data.base_url;
        }

        // Add this error logging function
        function handleClipboardError(err) {
            console.error('Clipboard error:', err);
            const tempInput = document.createElement('input');
            const fullUrl = window.location.href; // Fallback URL
            tempInput.value = fullUrl;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            alert('URL copied to clipboard!');
        }

        // Modified share handler with better feedback
        // Update the share button event listener
        // Update the share button handler
        document.addEventListener('click', async (e) => {
            const btn = e.target.closest('.share-btn');
            if (btn) {
                try {
                    // Get the actual view project URL from the anchor tag
                    const viewLink = btn.closest('.upload-actions').querySelector('a').href;
                    
                    // Visual feedback
                    const originalText = btn.innerHTML;
                    btn.innerHTML = '⏳ Copying...';
                    btn.style.pointerEvents = 'none';

                    // Try modern clipboard API first
                    await navigator.clipboard.writeText(viewLink);
                    
                    // Success feedback
                    btn.innerHTML = '✅ Copied!';
                    setTimeout(() => {
                        btn.innerHTML = originalText;
                        btn.style.pointerEvents = 'auto';
                    }, 2000);

                } catch (err) {
                    // Fallback for browsers that block clipboard access
                    const viewLink = btn.closest('.upload-actions').querySelector('a').href;
                    const tempInput = document.createElement('input');
                    tempInput.value = viewLink;
                    document.body.appendChild(tempInput);
                    tempInput.select();
                    document.execCommand('copy');
                    document.body.removeChild(tempInput);
                    
                    // Show success feedback even for fallback
                    btn.innerHTML = '✅ Copied!';
                    setTimeout(() => {
                        btn.innerHTML = '🔗 Share';
                        btn.style.pointerEvents = 'auto';
                    }, 2000);
                }
            }
        });

    // Update the initialization flow
    async function initialize() {
        try {
            await fetchBaseUrl();
            const regno = await fetchRegno();
            // Rest of your dashboard loading code
        } catch (error) {
            console.error('Initialization error:', error);
            alert('Failed to initialize page');
        }
    }

    // Start the initialization
    initialize();


    fetchRegno().then(regno => {
        fetch('/api/dashboard')
            .then(response => {
                if (!response.ok) throw new Error('Failed to load uploads');
                return response.json();
            })
            .then(data => {
                const list = document.getElementById('uploads-list');
                if (data.uploads && data.uploads.length > 0) {
                    data.uploads.forEach((upload, index) => {
                        const li = document.createElement('li');
                        li.className = 'upload-item';
                        li.style.animationDelay = `${index * 0.1}s`;
                        // Use the regno here after it's fetched
                        li.innerHTML = `
                            <div class="upload-info">
                                <strong>📄 ${upload.project_folder}</strong>
                                <div class="upload-actions">
                                    <a href="/projects/${regno}/${upload.project_folder}" target="_blank">
                                          View Project
                                    </a>
                                    <button class="share-btn" 
                                            data-path="${upload.project_folder}">
                                        🔗 Share
                                    </button>
                                    <button class="delete-btn" 
                                            data-id="${upload.id}"
                                            data-folder="${upload.project_folder}">
                                        🗑 Delete
                                    </button>
                                </div>
                            </div>
                            <div class="upload-time">
                                <i class="far fa-clock"></i>
                                ${new Date(upload.upload_time).toLocaleString()}
                            </div>`;
                        list.appendChild(li);
                    });
                } else {
                    list.innerHTML = '<li>No uploads found.</li>';
                }
            })
            .catch(error => {
                console.error('Error loading uploads:', error);
                alert('Failed to load uploads');
            });
    }).catch(error => {
        console.error('Error fetching regno:', error);
        alert('Failed to fetch regno');
    });
    // Add these functions to dashboard.html's script
    async function loadActivityLogs() {
            const activityList = document.getElementById('activity-list');
            const adminBadge = document.getElementById('adminBadge');
            
            try {
                // Show loading state
                activityList.innerHTML = '<div class="activity-item">Loading activities...</div>';

                const response = await fetch('/api/activity-logs');
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || `HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                // Validate response structure
                if (!data || !Array.isArray(data.logs)) {
                    throw new Error('Invalid activity data format');
                }

                // Clear existing content
                activityList.innerHTML = '';

                // Process registration numbers for admin view
                const regnos = data.logs.map(log => log.regno).filter(Boolean);
                const isAdminView = new Set(regnos).size > 1;
                adminBadge.style.display = isAdminView ? 'inline-block' : 'none';

                if (data.logs.length > 0) {
                    data.logs.forEach(log => {
                        const logItem = document.createElement('div');
                        logItem.className = `activity-item ${isAdminView ? 'admin-log' : ''}`;
                        
                        logItem.innerHTML = `
                            <div class="activity-time">
                                ${new Date(log.created_at).toLocaleString()}
                                ${log.ip_address ? `• ${log.ip_address}` : ''}
                            </div>
                            <div class="activity-action">
                                ${isAdminView ? `<span class="user-regno">${log.regno}</span>` : ''}
                                <div class="activity-icon">
                                    ${getActionIcon(log.action_type)}
                                </div>
                                ${log.description || formatDefaultAction(log.action_type)}
                            </div>
                        `;
                        activityList.appendChild(logItem);
                    });
                } else {
                    activityList.innerHTML = '<div class="activity-item">No activity records found</div>';
                }

                // Ensure section is expanded after load
                if (!logsVisible) toggleActivityLogs();

            } catch (error) {
                console.error('Activity log error:', error);
                activityList.innerHTML = `
                    <div class="activity-item error">
                        ⚠️ Failed to load activities: ${error.message}
                    </div>
                `;
                showNotification(`Activity Error: ${error.message}`, '#ff6b6b');
                
                // Collapse section on error
                if (logsVisible) toggleActivityLogs();
            }
        }

        // Enhanced helper functions
        function getActionIcon(actionType) {
            const iconMap = {
                upload: '📤',
                delete: '🗑️',
                login: '🔑',
                logout: '🚪',
                view: '👁️',
                register: '📝',
                download: '📥',
                update: '🔄'
            };
            return iconMap[actionType] || '📄';
        }

        function formatDefaultAction(actionType) {
            const actionMap = {
                upload: 'Uploaded project files',
                delete: 'Deleted a project',
                login: 'Logged into system',
                logout: 'Logged out from system',
                view: 'Viewed project',
                register: 'Registered new account',
                download: 'Downloaded project',
                update: 'Updated project'
            };
            return actionMap[actionType] || `Performed ${actionType} action`;
        }

        // Initialize everything
        document.addEventListener('DOMContentLoaded', () => {
            loadActivityLogs();
            initialize();  // Your existing initialize function
        });
</script>
</body>

</html>
