<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZipHost - Developer Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/dashboard.css') }}?v=1.0">
</head>
<body>
    <a href="/" class="home-link">
        <div class="home-link-content">
            <i class="fas fa-home"></i> <!-- Changed from fa-home to rocket for more visual interest -->
            <span class="home-link-text">ZipHost</span>
        </div>
    </a>
    
    <div class="dashboard-blob"></div>
    <div class="dashboard-blob"></div>    
    <div class="dashboard-container">
        <h2>Developer Dashboard</h2>
        
        <ul id="uploads-list">
        </ul>

        <div class="activity-section">
            <div class="toggle-header">
                <h3>
                    Activity Logs 
                    <span id="adminBadge" class="admin-badge" style="display: none;">🔒 Admin View</span>
                </h3>
                <span class="toggle-arrow" id="toggleArrow">▼</span>
            </div>
            <div class="activity-list" id="activity-list"></div>
        </div>

        <div class="actions">
            <a href="/deploy">
                <i class="fas fa-cloud-upload-alt"></i>
                New Project
            </a>
            <a href="/logout" class="logout-btn">
                <i class="fas fa-sign-out-alt"></i>
                Logout
            </a>
        </div>
        
    </div>
    <script src="{{ url_for('static', filename='scripts/dashboard.js') }}?v=1.0"></script>
</body>
</html>
